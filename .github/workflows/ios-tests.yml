name: iOS simulator tests

on:
  push:
    branches:
      - improve/keyboard-ux-30-20261014
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    if: "${{ !((github.event_name == 'push' && github.event.before == '24077a19ce3e046653d16fb3f078613dfffb9bdd' && github.event.head_commit.message == 'ci: decode retained run21 evidence only') || (github.event_name == 'push' && github.event.before == 'a50822f63ebfbbb3f1fc215d91244471353d66cf' && github.event.head_commit.message == 'ci: verify simulator app-group identity only') || (github.event_name == 'push' && github.event.before == '7eb7dc50b36cc3032701f59d933b93efecb5ae55' && github.event.head_commit.message == 'ci: decode retained run26 activation only')) }}"
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        height_endpoint: [90, 220]
    env:
      FSH_HEIGHT_ENDPOINT: ${{ matrix.height_endpoint }}
    steps:
      - uses: actions/checkout@v4
      # Run 20: 21m20s baseline + 360s case + ~134s overhead = ~29m34s.
      - name: Build and run XCTest
        timeout-minutes: 30
        run: bash ci/test-ios.sh
      - name: Benchmark native Foundation lookup
        if: ${{ always() && matrix.height_endpoint == 90 }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: bash Benchmarks/run-lookup-benchmark.sh
      - name: Save lookup benchmark
        if: ${{ always() && matrix.height_endpoint == 90 }}
        uses: actions/upload-artifact@v4
        with:
          name: lookup-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/lookup-benchmark/
          if-no-files-found: warn
          retention-days: 14
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-iphone-height-${{ matrix.height_endpoint }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  ipad:
    if: "${{ !((github.event_name == 'push' && github.event.before == '24077a19ce3e046653d16fb3f078613dfffb9bdd' && github.event.head_commit.message == 'ci: decode retained run21 evidence only') || (github.event_name == 'push' && github.event.before == 'a50822f63ebfbbb3f1fc215d91244471353d66cf' && github.event.head_commit.message == 'ci: verify simulator app-group identity only') || (github.event_name == 'push' && github.event.before == '7eb7dc50b36cc3032701f59d933b93efecb5ae55' && github.event.head_commit.message == 'ci: decode retained run26 activation only')) }}"
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        height_endpoint: [90, 220]
    env:
      FSH_HEIGHT_ENDPOINT: ${{ matrix.height_endpoint }}
      FSH_SIM_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPad-Air-11-inch-M3
    steps:
      - uses: actions/checkout@v4
      # Same measured height scope; per-test bounds and 40m job stay fixed.
      - name: Build and run XCTest on job-owned iPad
        timeout-minutes: 30
        run: bash ci/test-ios.sh
      - name: Save iPad diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-ipad-height-${{ matrix.height_endpoint }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  input_actions:
    if: "${{ !((github.event_name == 'push' && github.event.before == '24077a19ce3e046653d16fb3f078613dfffb9bdd' && github.event.head_commit.message == 'ci: decode retained run21 evidence only') || (github.event_name == 'push' && github.event.before == 'a50822f63ebfbbb3f1fc215d91244471353d66cf' && github.event.head_commit.message == 'ci: verify simulator app-group identity only') || (github.event_name == 'push' && github.event.before == '7eb7dc50b36cc3032701f59d933b93efecb5ae55' && github.event.head_commit.message == 'ci: decode retained run26 activation only')) }}"
    needs: [simulator, ipad]
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone
            device_type: com.apple.CoreSimulator.SimDeviceType.iPhone-16
          - device: ipad
            device_type: com.apple.CoreSimulator.SimDeviceType.iPad-Air-11-inch-M3
    env:
      FSH_ACCEPTANCE_SCENARIO: actions
      FSH_SIM_DEVICE_TYPE: ${{ matrix.device_type }}
    steps:
      - uses: actions/checkout@v4
      # Run 20 common baseline 17m10s + two 360s cases + ~134s overhead
      # = ~31m24s, bounded to this 35m action step; job remains 40m.
      - name: Build and run installed input actions on fresh owned simulator
        timeout-minutes: 35
        run: bash ci/test-ios.sh
      - name: Save input-actions diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ matrix.device }}-input-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    if: "${{ always() && !((github.event_name == 'push' && github.event.before == '24077a19ce3e046653d16fb3f078613dfffb9bdd' && github.event.head_commit.message == 'ci: decode retained run21 evidence only') || (github.event_name == 'push' && github.event.before == 'a50822f63ebfbbb3f1fc215d91244471353d66cf' && github.event.head_commit.message == 'ci: verify simulator app-group identity only') || (github.event_name == 'push' && github.event.before == '7eb7dc50b36cc3032701f59d933b93efecb5ae55' && github.event.head_commit.message == 'ci: decode retained run26 activation only')) }}"
    needs: [simulator, ipad, input_actions]
    runs-on: ubuntu-latest
    steps:
      - name: Require all same-SHA height and input-action jobs successful
        env:
          IPHONE_HEIGHT_RESULT: ${{ needs.simulator.result }}
          IPAD_HEIGHT_RESULT: ${{ needs.ipad.result }}
          INPUT_ACTIONS_RESULT: ${{ needs.input_actions.result }}
        run: |
          printf 'iPhone heights=%s\niPad heights=%s\ninput actions=%s\n' "$IPHONE_HEIGHT_RESULT" "$IPAD_HEIGHT_RESULT" "$INPUT_ACTIONS_RESULT"
          test "$IPHONE_HEIGHT_RESULT" = success
          test "$IPAD_HEIGHT_RESULT" = success
          test "$INPUT_ACTIONS_RESULT" = success

  decode_retained_run21:
    if: "${{ github.event_name == 'push' && github.event.before == '24077a19ce3e046653d16fb3f078613dfffb9bdd' && github.event.head_commit.message == 'ci: decode retained run21 evidence only' }}"
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Decode two retained run-21 failures only
        timeout-minutes: 17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/decode-run21-evidence.sh
      - name: Save diagnostic-only decoded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run21-two-retained-cases-decoded-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/run21-decode/
          if-no-files-found: error
          retention-days: 14

  simulator_identity_probe:
    if: "${{ github.event_name == 'push' && github.event.before == 'a50822f63ebfbbb3f1fc215d91244471353d66cf' && github.event.head_commit.message == 'ci: verify simulator app-group identity only' }}"
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify arm64 Simulator identity only
        timeout-minutes: 17
        run: bash ci/verify-simulator-build-identity.sh
      - name: Save build-only identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-app-group-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/simulator-build-identity/
          if-no-files-found: error
          retention-days: 14

  decode_retained_run26_activation:
    if: "${{ github.event_name == 'push' && github.event.before == '7eb7dc50b36cc3032701f59d933b93efecb5ae55' && github.event.head_commit.message == 'ci: decode retained run26 activation only' }}"
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Decode two pinned run-26 installed failures only
        timeout-minutes: 17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/decode-run26-activation.sh
      - name: Save retained diagnostic-only decode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run26-two-retained-cases-decoded-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/run26-activation-decode/
          if-no-files-found: error
          retention-days: 14

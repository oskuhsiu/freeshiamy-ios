name: iOS simulator tests

on:
  push:
    branches:
      - improve/keyboard-ux-30-20261014
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and run XCTest
        timeout-minutes: 25
        run: bash ci/test-ios.sh
      - name: Benchmark native Foundation lookup
        if: always()
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: bash Benchmarks/run-lookup-benchmark.sh
      - name: Save lookup benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lookup-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/lookup-benchmark/
          if-no-files-found: warn
          retention-days: 14
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14
